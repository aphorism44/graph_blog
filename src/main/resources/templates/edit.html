<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>Life Fractal</title>
    <script src="/js/tinymce/tinymce.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Fractal Blog - Editor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/edit}">Entry Editor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/edit}">Entry List</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div class="row">
        <h1> Entry Editor </h1>
    </div>
	<form id="entryForm" action="#" th:action="@{/entries/save}" method="post" th:object="${entry}">
    <!-- Entry ID (hidden input for tracking) -->
    <input type="hidden" id="entryId" name="id" th:field="*{id}" />

    <!-- Title Field -->
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" th:field="*{title}" required />
    <br><br>

    <!-- Content Field -->
    <label for="text">Content:</label>
    <textarea id="content" name="text" th:field="*{text}"></textarea>
    <br><br>

    <!-- Navigation Buttons -->
    <div>
        <!-- Previous Button -->
        <button type="button" id="prevButton" th:if="${entry.hasPreviousEntry}"
                onclick="navigateToEntry('previous')">Previous</button>
        
        <!-- Save Button -->
        <button type="submit">Save</button>
        
        <!-- Next Button -->
		<button type="button" id="nextButton" th:if="${entry.hasNextEntry}"
		        onclick="navigateToEntry('next')">Next</button>
		
		<!-- New Entry Button -->
		<button type="button" id="newEntryButton" th:if="${!entry.hasNextEntry}"
		        onclick="createNewEntry()">New Entry</button>
	</div>
</form>

<script>
    // Initialize TinyMCE on the textarea with the ID "content"
    tinymce.init({
        selector: '#content', // Matches the textarea with id="content"
        plugins: 'autolink lists link charmap preview', // Plugins for extended functionality
        toolbar: 'undo redo | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link',
        menubar: false, // Remove the default menu bar
        height: 300, // Set the height of the editor
        branding: false, // Remove the TinyMCE branding
        statusbar: false, // Hide the status bar below the editor
        license_key: 'gpl' //use open source version
    });

    // Function to handle navigation between entries
function navigateToEntry(direction) {
    const entryId = document.getElementById('entryId').value;
    fetch('/entries/navigate', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
        },
        body: new URLSearchParams({ currentEntryId: entryId, direction: direction })
    })
    .then(response => {
        if (!response.ok) throw new Error('Navigation failed');
        window.location.href = '/edit';
    })
    .catch(error => alert('Error: ' + error.message));
}

// Function to handle saving the current entry
function saveEntry() {
    const entryId = document.getElementById('entryId').value; // Get the current entry ID
    const title = document.getElementById('title').value; // Get the title value
    const text = tinymce.get("content").getContent(); // Get the content from TinyMCE editor

    // Retrieve CSRF token from meta tag or hidden input
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

    // Create the entry object to send
    const entryData = {
        id: entryId,
        title: title,
        text: text
    };

    // Make a POST request to save the entry
    fetch('/entries/save', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-TOKEN': csrfToken // Add CSRF token to headers
        },
        body: JSON.stringify(entryData) // Send the entry data as JSON
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Failed to save entry');
        }
        return response.text(); // The server responds with success
    })
    .then(() => {
        alert('Entry saved successfully!');
    })
    .catch(error => {
        alert('Error: ' + error.message);
    });
}

// Function to handle creating a new entry
function createNewEntry() {
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');

    fetch('/entries/create', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-TOKEN': csrfToken
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
        }
        return response.text();
    })
    .then(() => {
        window.location.href = '/edit'; // Redirect to the edit page
    })
    .catch(error => {
        console.error('Error during fetch:', error);
        alert(`Error: ${error.message}`);
    });
}
</script>

</div>
</body>
</html>
